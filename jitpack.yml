jdk:
  - openjdk21

before_install:
  - echo "JitPack build starting"

# Only build the library modules you need for JitPack artifacts
install:
  - ./gradlew :libaums:assembleRelease :httpserver:assembleRelease :storageprovider:assembleRelease :javafs:assembleRelease -x test --no-daemon --stacktrace
